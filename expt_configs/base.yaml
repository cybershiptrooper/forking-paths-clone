model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
prompt: >-
  A rectangular band formation is a formation with $m$ band members in each of
  $r$ rows, where $m$ and $r$ are integers. A particular band has less than 100
  band members. The director arranges them in a rectangular formation and finds
  that he has two members left over. If he increases the number of members in
  each row by 1 and reduces the number of rows by 2, there are exactly enough
  places in the new formation for each band member. What is the largest number
  of members the band could have?

num_new_branches: 1
masking_algorithm: nodewise_attribution_attention
pair_aggregation: sum
mask_granularity: head
layers_to_analyse: all
ablate_non_target_layers: true
renormalize_masked_attention: true
num_ig_steps: 10
num_random_samples: 1
max_new_tokens: 200
min_sentence_length: 10
temperature: 0.6
seed: 42
device: cuda
mask_mode: prefix
sentence_gap: 0
sentence_chunk: 1
objective: kl_divergence
output_dir: results/circuit_discovery
