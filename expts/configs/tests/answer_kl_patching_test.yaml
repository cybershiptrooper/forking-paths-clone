model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
# data_path: data/collection/deepseek_llama_8b/math_open.json
# prompt_index: 6
prompt: "Question: If (1+16*x)^2 = 1.44, what is the value of x?"
# reward_type: correctness
objective: answer_kl
masking_algorithm: nodewise_activation_patching_kv_cache
num_new_branches: 2
mask_granularity: pair
mask_mode: prefix
layers_to_analyse: all
max_sampling_tokens: 5000
analysis_timestep: 20 #1126
sentence_gap: 1
output_dir: results/circuit_discovery
file_name: answer_kl_patching_test
ablate_non_target_layers: true
device: cuda:0
