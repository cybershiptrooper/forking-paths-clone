# Objective 1: Faithfulness (answer distribution preservation)
# Finds the minimal circuit that reproduces the clean model's answer distribution.
# Uses answer_kl objective with importance sampling.

model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
data_path: data/collection/deepseek_llama_8b/math_open.json
prompt_index: 6

objective: answer_kl
masking_algorithm: nodewise_activation_patching_kv_cache
num_new_branches: 16
mask_granularity: pair
mask_mode: prefix
layers_to_analyse: all
max_new_tokens: 5000
analysis_timestep: 1126
sentence_gap: 4
output_dir: results/circuit_discovery/faithfulness_patching
ablate_non_target_layers: true
device: auto

# More branches improves IS quality (higher N_eff).
# No reward_type — answers are bucketed by normalized \boxed{} extraction (Option A).
# To use LLM judge clustering (Option B), add:
#   judge_answers: true
#   judge_model: meta-llama/llama-3.2-3b-instruct
