# model_name: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
model_name: Qwen/Qwen3-4B
data_path: data/collection/deepseek_llama_8b/math_open.json
prompt_index: 6
reward_type: correctness
objective: kl_divergence
# masking_algorithm: nodewise_activation_patching
masking_algorithm: nodewise_attribution_attention
num_new_branches: 16
mask_granularity: pair
mask_mode: prefix
# num_ig_steps: 2
# layers_to_analyse: all 
